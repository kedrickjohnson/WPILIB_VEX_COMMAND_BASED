# Builds everything, runs the tests and both simulators on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test (library, template, Clawbot, doc examples)
        run: ./gradlew build

      - name: Template auto runs in the simulator
        run: ./gradlew -q :template:simulate | tee template-sim.txt && grep -q "Auto done" template-sim.txt

      - name: Clawbot auto runs in the simulator
        run: ./gradlew -q :examples:clawbot:simulate | tee clawbot-sim.txt && grep -q "Auto done" clawbot-sim.txt

      - name: Documentation examples run in the simulator
        run: ./gradlew -q :examples:docs:simulate | tee docs-sim.txt && grep -q "all checks passed" docs-sim.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: VS Code extension tests
        working-directory: vscode-extension
        run: node scripts/bundle.js && node test/run.js

      - name: Docs site builds (checks internal links)
        run: python3 docs-src/build.py
